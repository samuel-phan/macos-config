- name: Install cask session-manager-plugin
  # ansible_become_password must be set in inventory or group_vars; it is not populated by -K
  community.general.homebrew_cask:
    name: session-manager-plugin
    state: present
    sudo_password: "{{ ansible_become_password }}"

- name: Install base packages
  community.general.homebrew:
    name:
      - awscli
      - cosign
      - direnv
      - git
      - gnupg
      - go
      - google-cloud-sdk
      - graphviz # dot CLI used by "terraform graph"
      - helm
      - htop
      - iterm2
      - jq
      - krew
      - kubectx
      - kubernetes-cli
      - neovim
      - netcat
      - openssl
      - podman-desktop
      - pre-commit
      - python3
      - ripgrep
      - sops
      - subnetcalc
      - tenv
      - tig
      - tmux
      - trash
      - tree
      - utm
      - uv
      - vim
      - vlc
      - yq
      - zsh
      - zsh-completions
    state: latest

- name: Add Homebrew repository for awsd
  community.general.homebrew_tap:
    name: radiusmethod/awsd
    state: present

- name: Install awsd package
  community.general.homebrew:
    name: radiusmethod/awsd/awsd
    state: latest

- name: Add Homebrew repository for fluxcd
  community.general.homebrew_tap:
    name: fluxcd/tap
    state: present

- name: Install flux package
  community.general.homebrew:
    name: fluxcd/tap/flux
    state: latest
